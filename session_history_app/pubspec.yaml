name: session_history_app
description: "Session History - Application de gestion locale de sessions avec fonctionnalites IA basiques"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de donnees locale (non utilisee : l'authentification et les
  # sessions passent maintenant par l'API backend)


  # Gestion d'etat
  provider: ^6.1.2

  # UI / UX
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # Utilitaires
  shared_preferences: ^2.2.3
  http: ^1.2.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true